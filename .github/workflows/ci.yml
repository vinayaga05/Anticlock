name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages (contracts, api, admin)
        run: pnpm typecheck

      - name: Typecheck mobile (non-blocking)
        working-directory: apps/mobile
        run: npx tsc --noEmit -p .
        continue-on-error: true
        # Mobile has pre-existing type errors related to:
        # - ViewStyle type compatibility with conditional expressions
        # - @anticlock/contracts module resolution
        # - React Navigation types
        # This job is informational; it does not block the CI pipeline.

  test-api:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        # @anticlock/contracts resolves to ./dist (gitignored), so it must be
        # compiled before anything imports it at runtime/bundle time. Mirrors
        # the Dockerfiles, which build contracts before api/admin.
        run: pnpm --filter @anticlock/contracts build

      - name: Run API tests
        working-directory: apps/api
        run: pnpm test
        env:
          # Test env vars - API tests use mocked providers
          AI_PROVIDER: groq
          GROQ_API_KEY: gsk_test
          OPENAI_API_KEY: sk_test
          NODE_ENV: test
        # Note: API tests are unit/integration tests using node:test.
        # They do not require a live Postgres database - they test
        # config loading, contract validation, AI provider setup, and
        # business logic with in-memory or mocked dependencies.

  build-admin:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        # @anticlock/contracts resolves to ./dist (gitignored), so it must be
        # compiled before anything imports it at runtime/bundle time. Mirrors
        # the Dockerfiles, which build contracts before api/admin.
        run: pnpm --filter @anticlock/contracts build

      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.anticlock.online

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0B0B0F 0%, #1a1a24 50%, #0B0B0F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .glow1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
    }
    .glow2 {
      position: absolute;
      bottom: -150px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(249, 112, 102, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 40px;
      background: linear-gradient(135deg, #14B8A6, #F97066);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: bold;
      color: white;
      box-shadow: 0 20px 60px rgba(20, 184, 166, 0.4);
    }
    h1 {
      font-size: 80px;
      font-weight: 800;
      margin: 0 0 24px;
      background: linear-gradient(135deg, #14B8A6 0%, #F97066 50%, #84CC16 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    p {
      font-size: 36px;
      color: rgba(255, 255, 255, 0.85);
      margin: 0;
      line-height: 1.4;
      max-width: 900px;
    }
    .tagline {
      display: inline-flex;
      gap: 16px;
      margin-top: 32px;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
    }
    .tagline span {
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="content">
    <div class="logo">A</div>
    <h1>Anticlock</h1>
    <p>Your lifestyle, simplified</p>
    <div class="tagline">
      <span>9 Service Categories</span>
      <span>Social Discovery</span>
      <span>AI-Powered</span>
    </div>
  </div>
</body>
</html>

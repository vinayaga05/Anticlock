buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        REACT_NATIVE_NODE_MODULES_DIR = file("../../../node_modules/react-native")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * @react-native-voice/voice still declares com.android.support:appcompat-v7,
 * which clashes with AndroidX (duplicate INotificationSideChannel, etc.).
 * Its Java sources only need AndroidX annotations — drop the old Support libs.
 */
subprojects { subproject ->
    subproject.configurations.configureEach {
        exclude group: "com.android.support"
    }
}

/**
 * reanimated / worklets hardcode commandLine("node", ...). Android Studio's
 * Gradle daemon often has no Homebrew on PATH, so the stock assert tasks fail
 * with "Cannot run program node". Always disable them and re-run checks with
 * an absolute node path from nodeEnv.gradle / local.properties.
 */
gradle.projectsEvaluated {
    def nodeBinary = gradle.ext.has("nodeBinary")
        ? gradle.ext.nodeBinary as String
        : System.getProperty("anticlock.node.binary")
    if (!nodeBinary || !new File(nodeBinary).canExecute()) {
        def fallbacks = [
            "/opt/homebrew/bin/node",
            "/usr/local/bin/node",
            "${System.getProperty('user.home')}/.local/bin/node",
        ]
        nodeBinary = fallbacks.find { new File(it).canExecute() }
    }

    rootProject.subprojects.each { sub ->
        if (!(sub.name in ["react-native-reanimated", "react-native-worklets"])) {
            return
        }

        sub.tasks.matching {
            it.name in ["assertMinimalReactNativeVersionTask", "assertWorkletsVersionTask"]
        }.configureEach {
            enabled = false
        }

        if (!nodeBinary) {
            logger.warn("[Anticlock] No node binary for :${sub.name} asserts; stock tasks disabled")
            return
        }

        def node = nodeBinary
        def scriptsDir = new File(sub.projectDir, "../scripts")

        def rnAssert = sub.tasks.register("assertMinimalReactNativeVersionWithNode") {
            onlyIf { new File(scriptsDir, "validate-react-native-version.js").exists() }
            doLast {
                def rnDir = rootProject.ext.has("REACT_NATIVE_NODE_MODULES_DIR")
                    ? rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR as File
                    : new File(rootProject.projectDir, "../../../node_modules/react-native")
                def propsFile = new File(rnDir, "ReactAndroid/gradle.properties")
                def rnVersion = "0.0.0"
                if (propsFile.exists()) {
                    def props = new Properties()
                    propsFile.withInputStream { props.load(it) }
                    rnVersion = props.getProperty("VERSION_NAME", rnVersion)
                }
                sub.exec {
                    workingDir sub.projectDir
                    commandLine node, "./../scripts/validate-react-native-version.js", rnVersion
                }
            }
        }

        def workletsAssert = sub.tasks.register("assertWorkletsVersionWithNode") {
            onlyIf {
                sub.name == "react-native-reanimated" &&
                    new File(scriptsDir, "validate-worklets-build.js").exists()
            }
            doLast {
                sub.exec {
                    workingDir sub.projectDir
                    commandLine node, "./../scripts/validate-worklets-build.js"
                }
            }
        }

        sub.tasks.named("preBuild").configure {
            dependsOn(rnAssert)
            if (sub.name == "react-native-reanimated") {
                dependsOn(workletsAssert)
            }
        }
    }
}

/**
 * AGP prefab bug with react-native-nitro-modules:
 * MMKV's ninja looks for `NitroModules.so` under cxx/refs, but the prefab
 * package only ships `libNitroModules.so` and the copy into refs is incomplete.
 * Copy/symlink both names before MMKV's CMake link step.
 */
def patchNitroPrefabForMmkv = { Project mmkvProject ->
    def nitroPrefabRoot = new File(
        mmkvProject.rootProject.projectDir,
        "../../../node_modules/react-native-nitro-modules/android/build/intermediates/prefab_package"
    )
    def refsRoot = new File(
        mmkvProject.projectDir,
        "build/intermediates/cxx/refs/react-native-nitro-modules"
    )
    if (!refsRoot.exists() || !nitroPrefabRoot.exists()) {
        return
    }
    refsRoot.eachDir { hashDir ->
        def libsDir = new File(hashDir, "modules/NitroModules/libs")
        if (!libsDir.exists()) return
        libsDir.eachDir { abiDir ->
            def abiName = abiDir.name // android.arm64-v8a
            ["debug", "release"].each { variant ->
                def src = new File(
                    nitroPrefabRoot,
                    "${variant}/prefab/modules/NitroModules/libs/${abiName}/libNitroModules.so"
                )
                if (!src.exists()) return
                def libNamed = new File(abiDir, "libNitroModules.so")
                def plainNamed = new File(abiDir, "NitroModules.so")
                if (!libNamed.exists() || libNamed.lastModified() < src.lastModified()) {
                    ant.copy(file: src, tofile: libNamed, overwrite: true)
                }
                if (!plainNamed.exists() || plainNamed.lastModified() < src.lastModified()) {
                    ant.copy(file: src, tofile: plainNamed, overwrite: true)
                }
            }
        }
    }
}

gradle.projectsEvaluated {
    def mmkv = rootProject.subprojects.find { it.name == "react-native-mmkv" }
    if (mmkv == null) return
    mmkv.tasks.configureEach { task ->
        if (task.name.startsWith("buildCMake")) {
            task.doFirst {
                patchNitroPrefabForMmkv(mmkv)
            }
        }
    }
}

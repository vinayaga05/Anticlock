pluginManagement {
    includeBuild("../../../node_modules/@react-native/gradle-plugin")
    // AGP 8.12.0 embeds R8 8.12.14, which crashes while shrinking Firebase's
    // CycleDetector$Dep. Pin the patched shrinker while retaining release optimization.
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath("com.android.tools:r8:8.12.28")
        }
    }
}
plugins { id("com.facebook.react.settings") }

// Fix PATH for Android Studio / Gradle daemon before subprojects look up `node`.
// Must come after pluginManagement/plugins blocks (Gradle requirement).
apply from: new File(settingsDir, "nodeEnv.gradle")

def npx = (gradle.ext.has("nodeBinDir") ? "${gradle.ext.nodeBinDir}/npx" : "/opt/homebrew/bin/npx")
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
    ex.autolinkLibrariesFromCommand([npx, "@react-native-community/cli", "config"])
}
rootProject.name = 'AnticlockTemp'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')

/**
 * Resolve an absolute node binary for Android builds.
 *
 * Do NOT mutate java.lang.ProcessEnvironment — on JDK 17+ its map uses
 * Variable/Value keys, and putting raw Strings breaks every later ProcessBuilder
 * (including Gradle exec) with ClassCastException / "Cannot run program node".
 *
 * Applied from settings.gradle. Reanimated/worklets stock assert tasks that
 * call bare `node` are replaced in root build.gradle with absolute-path checks.
 */

def readLocalProp = { String key ->
    def f = new File(settingsDir, "local.properties")
    if (!f.exists()) return null
    def props = new Properties()
    f.withInputStream { props.load(it) }
    return props.getProperty(key)?.trim()
}

def nodeCandidates = []
def fromLocal = readLocalProp("node.binary") ?: readLocalProp("NODE_BINARY")
if (fromLocal) nodeCandidates << fromLocal
def fromEnv = System.getenv("NODE_BINARY")
if (fromEnv) nodeCandidates << fromEnv.trim()
def fromGradleProp = providers.gradleProperty("react.nodeExecutableAndArgs").orNull
if (fromGradleProp) {
    nodeCandidates << fromGradleProp.split(/[\s,]+/)[0].trim()
}
nodeCandidates.addAll([
    "/opt/homebrew/bin/node",
    "/usr/local/bin/node",
    "${System.getProperty('user.home')}/.local/bin/node",
    "${System.getProperty('user.home')}/.hermes/node/bin/node",
])

def nodeBinary = nodeCandidates.find { path ->
    if (!path) return false
    def f = new File(path)
    f.isFile() && f.canExecute()
}

if (nodeBinary == null) {
    logger.warn("[Anticlock] Could not locate a node binary. Set node.binary in android/local.properties.")
    return
}

def nodeFile = new File(nodeBinary).canonicalFile
System.setProperty("anticlock.node.binary", nodeFile.absolutePath)
gradle.ext.nodeBinary = nodeFile.absolutePath
gradle.ext.nodeBinDir = nodeFile.parentFile.absolutePath
logger.lifecycle("[Anticlock] Using node at ${nodeFile.absolutePath}")
